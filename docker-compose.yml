services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whitmore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whitmore_db_pass}
      POSTGRES_DB: whitmore
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whitmore"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MODE: production
      DATABASE_URL: postgresql+psycopg://whitmore:${POSTGRES_PASSWORD:-whitmore_db_pass}@db:5432/whitmore
      UPLOAD_DIR: /srv/data/uploads
    volumes:
      - uploads:/srv/data/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

